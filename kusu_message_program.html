<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Courier New", monospace;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #stage {
    width: 100%;
    min-height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
  }

  .dialog {
    width: min(680px, 92vw);
    background: #efefef;
    border: 2px solid #777;
    color: #111;
    box-shadow: 8px 10px 0 rgba(255,255,255,.08),
                0 0 0 1px #222;
    animation: appear .28s ease-out;
  }

  @keyframes appear {
    from {
      opacity: 0;
      transform: scale(.88) translateY(12px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  .dialog.removing {
    animation: disappear .22s ease-in forwards;
  }

  @keyframes disappear {
    to {
      opacity: 0;
      transform: scale(.9) translateY(-10px);
    }
  }

  .titlebar {
    height: 38px;
    padding: 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(#263fa8, #122478);
    color: white;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 16px;
  }

  .close {
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    background: #ddd;
    color: #111;
    border: 1px solid #111;
    font-size: 17px;
    line-height: 1;
  }

  .message-area {
    min-height: 170px;
    padding: 28px 22px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
  }

  .message {
    max-width: 95%;
    text-align: center;
    font-size: clamp(17px, 4vw, 29px);
    line-height: 1.25;
    white-space: pre-line;
  }

  #no {
    min-width: 90px;
    min-height: 42px;
    padding: 7px 24px;
    border: 2px solid #777;
    border-top-color: #fff;
    border-left-color: #fff;
    background: #ddd;
    color: #111;
    font: 18px "Courier New", monospace;
    cursor: pointer;
    box-shadow: 2px 2px 0 #555;
    touch-action: manipulation;
  }

  #no:active {
    border-top-color: #777;
    border-left-color: #777;
    border-bottom-color: #fff;
    border-right-color: #fff;
    box-shadow: none;
    transform: translate(2px, 2px);
  }

  .ending {
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    animation: appear .8s ease-out;
  }

  .ending h1 {
    font-size: clamp(25px, 7vw, 48px);
    margin: 0 0 12px;
  }

  .ending p {
    font-size: 17px;
    opacity: .7;
    margin: 0;
  }

  @media (max-width: 420px) {
    #stage { padding: 14px; }
    .message-area { min-height: 155px; padding: 22px 14px 12px; }
    .titlebar { height: 34px; font-size: 14px; }
    .close { width: 20px; height: 20px; }
  }
</style>
</head>

<body>
<div id="stage" aria-live="polite"></div>

<script>
(() => {
  // Your messages, in the exact order you provided.
  const messages = [
    "Lately kusu's been busy....",
    "wondering if you miss me😭😭",
    "Why did you not talk to me?",
    "I just wanna know🥺",
    "Did i do something wrong, that makes you hate me so...",
    "Talk to me, I'll listen",
    "All the love I'm giving\ndon't act like you don't know🫠",
    "I was out there on the road 👀",
    "life out of control😩",
    "I became a victim to your busy schedule",
    "And I know that it's fair, that don't mean that I don't care😳",
    "This one's dedicated to the my baby out there."
  ];

  const stage = document.getElementById("stage");
  let index = 0;
  let locked = false;

  function showMessage() {
    stage.innerHTML = "";

    const dialog = document.createElement("section");
    dialog.className = "dialog";
    dialog.setAttribute("role", "dialog");
    dialog.setAttribute("aria-label", "Message");

    dialog.innerHTML = `
      <div class="titlebar">
        <span>Message</span>
        <span class="close">×</span>
      </div>
      <div class="message-area">
        <div class="message"></div>
        <button id="no" type="button">NO</button>
      </div>
    `;

    dialog.querySelector(".message").textContent = messages[index];
    stage.appendChild(dialog);

    dialog.querySelector("#no").addEventListener("click", nextMessage);
  }

  function nextMessage() {
    if (locked) return;
    locked = true;

    const dialog = stage.querySelector(".dialog");
    dialog.classList.add("removing");

    setTimeout(() => {
      index++;

      if (index < messages.length) {
        locked = false;
        showMessage();
      } else {
        showEnding();
      }
    }, 220);
  }

  function showEnding() {
    stage.innerHTML = `
      <div class="ending">
        <h1>💌 That's all...</h1>
        <p>but you better talk to me now 😭</p>
      </div>
    `;
  }

  showMessage();
})();
</script>
</body>
</html>
